services:
  db:
    image: postgres:16-alpine
    container_name: rafiqi-db
    environment:
      POSTGRES_USER: rafiqi
      POSTGRES_PASSWORD: rafiqi
      POSTGRES_DB: rafiqi
    ports:
      # Bound to loopback on 5433: another local PostgreSQL holds 127.0.0.1:5432,
      # and a wildcard 5432 publish loses to it for every "localhost" connection.
      - "127.0.0.1:5433:5432"
    volumes:
      - rafiqi_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rafiqi -d rafiqi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rafiqi_db_data:
